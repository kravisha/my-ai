<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Jarvis Gateway</title>
<!--
  The Super User client (addendum 16 §8: a phone-accessible web client; a native
  app is explicitly not required for the first implementation).

  One file, no build step, no external requests. This repository has no frontend
  toolchain and a single-user page does not justify introducing one; and a page
  that fetches nothing from a third party cannot leak a session to one. It is
  written mobile-first because §8's target client is a phone browser, and voice
  (§9) will be added to this same page at G6.
-->
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #17181a; --muted: #6b6f76;
    --line: #e2e2df; --accent: #2f6f4f; --user: #eceef1; --error: #a3312a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e1f23; --ink: #ecedee; --muted: #9aa0a6;
      --line: #2c2e33; --accent: #7fc8a0; --user: #26282d; --error: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: baseline; gap: .6rem;
    padding: .7rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .01em; }
  #status { font-size: .78rem; color: var(--muted); margin-left: auto; }
  #status.live { color: var(--accent); }
  #status.error { color: var(--error); }
  main { flex: 1; overflow-y: auto; padding: 1rem; }
  .turn { max-width: 46rem; margin: 0 auto 1rem; }
  .turn .who { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .25rem; }
  .turn .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn.user .text { background: var(--user); padding: .6rem .8rem; border-radius: .6rem; }
  .turn.error .text { color: var(--error); }
  form.composer {
    display: flex; gap: .5rem; padding: .7rem 1rem;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  textarea, input {
    flex: 1; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: .5rem; padding: .55rem .7rem;
  }
  textarea { resize: none; max-height: 8rem; }
  button {
    font: inherit; font-weight: 600; color: var(--bg); background: var(--ink);
    border: 0; border-radius: .5rem; padding: .55rem 1rem; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  /* Scoreboard */
  #board-toggle {
    font: inherit; font-size: .78rem; font-weight: 600; color: var(--ink);
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: .15rem .6rem; cursor: pointer;
  }
  #board-toggle .count { color: var(--muted); font-weight: 500; }
  #board-toggle .count.urgent { color: var(--error); font-weight: 700; }
  #board { max-width: 46rem; margin: 0 auto; display: grid; gap: .7rem; }
  #board .empty { color: var(--muted); }
  .item {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--line); border-radius: .5rem; padding: .7rem .8rem;
  }
  .item.urgent { border-left-color: var(--error); }
  .item.important { border-left-color: var(--accent); }
  .item.resolved { opacity: .6; }
  .item .meta {
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline;
    font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .item .meta .level { font-weight: 700; }
  .item .meta .level.urgent { color: var(--error); }
  .item { cursor: pointer; }
  .item .question { margin: .35rem 0 0; overflow-wrap: anywhere; }
  .item .discussion { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: .45rem 0 0; }
  .item .resolution, .item .note {
    margin: .4rem 0 0; padding-left: .6rem; border-left: 2px solid var(--line);
    font-size: .9rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #status-toggle {
    font: inherit; font-size: .78rem; font-weight: 600; color: var(--ink);
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: .15rem .6rem; cursor: pointer;
  }
  #system { max-width: 46rem; margin: 0 auto; display: grid; gap: .5rem; }
  #system .unavailable {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--muted);
    border-radius: .5rem; padding: .7rem .8rem; color: var(--muted);
  }
  .agent {
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: .5rem; padding: .5rem .8rem;
  }
  .agent.crashed { border-left-color: var(--error); }
  .agent.dormant { border-left-color: var(--muted); opacity: .7; }
  .agent .identity { font-weight: 600; }
  .agent .axis { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .agent .axis.bad { color: var(--error); font-weight: 700; }
  /* Voice */
  #mic {
    background: none; border: 1px solid var(--line); color: var(--ink);
    border-radius: .5rem; padding: .45rem .6rem; font-size: 1.05rem; line-height: 1;
  }
  #mic.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #mic.unsupported { opacity: .4; }
  #voice-bar {
    display: flex; align-items: center; gap: .75rem;
    padding: .5rem 1rem; border-top: 1px solid var(--line); background: var(--panel);
  }
  #voice-state { font-size: .8rem; color: var(--muted); }
  #voice-state.hearing { color: var(--accent); font-weight: 600; }
  #voice-state.speaking { color: var(--ink); font-weight: 600; }
  #interrupt { margin-left: auto; padding: .35rem .8rem; font-size: .8rem; }
  #login { max-width: 22rem; margin: 3rem auto; display: grid; gap: .6rem; }
  #login p { margin: 0; color: var(--muted); font-size: .85rem; }
  #login .problem { color: var(--error); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Jarvis Gateway</h1>
  <button type="button" id="board-toggle" class="hidden">Scoreboard <span class="count" id="board-count"></span></button>
  <button type="button" id="status-toggle" class="hidden">System</button>
  <span id="status">offline</span>
</header>

<main id="main">
  <form id="login">
    <p>Super User sign-in.</p>
    <input id="username" name="username" autocomplete="username" placeholder="username" autocapitalize="none">
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="password">
    <button type="submit">Sign in</button>
    <p id="login-problem" class="problem"></p>
  </form>
  <div id="transcript" class="hidden"></div>
  <div id="board" class="hidden"></div>
  <div id="system" class="hidden"></div>
</main>

<form class="composer hidden" id="composer">
  <button type="button" id="mic" title="Voice" aria-label="Voice">🎙</button>
  <textarea id="input" rows="1" placeholder="Message" autocapitalize="sentences"></textarea>
  <button type="submit" id="send">Send</button>
</form>
<div id="voice-bar" class="hidden">
  <span id="voice-state">listening…</span>
  <button type="button" id="interrupt">Stop</button>
</div>

<script>
(() => {
  "use strict";

  const els = {
    status: document.getElementById("status"),
    login: document.getElementById("login"),
    loginProblem: document.getElementById("login-problem"),
    username: document.getElementById("username"),
    password: document.getElementById("password"),
    transcript: document.getElementById("transcript"),
    composer: document.getElementById("composer"),
    mic: document.getElementById("mic"),
    voiceBar: document.getElementById("voice-bar"),
    voiceState: document.getElementById("voice-state"),
    interrupt: document.getElementById("interrupt"),
    board: document.getElementById("board"),
    system: document.getElementById("system"),
    statusToggle: document.getElementById("status-toggle"),
    boardToggle: document.getElementById("board-toggle"),
    boardCount: document.getElementById("board-count"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    main: document.getElementById("main"),
  };

  // sessionStorage, not localStorage: the token dies with the tab. This service
  // is specified as a high-security boundary (addendum 17 §14), and the
  // conversation itself is held server-side, so persisting the credential would
  // buy convenience with the only thing worth protecting here.
  const TOKEN_KEY = "jarvis-gateway-token";
  let socket = null;
  let streaming = null;   // the assistant turn currently being received

  const setStatus = (text, kind) => {
    els.status.textContent = text;
    els.status.className = kind || "";
  };

  const atBottom = () => els.main.scrollHeight - els.main.scrollTop - els.main.clientHeight < 60;
  const scroll = (wasAtBottom) => { if (wasAtBottom) els.main.scrollTop = els.main.scrollHeight; };

  function addTurn(role, text) {
    const wasAtBottom = atBottom();
    const turn = document.createElement("div");
    turn.className = "turn " + role;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "you" : role === "error" ? "gateway" : "assistant";
    const body = document.createElement("div");
    body.className = "text";
    body.textContent = text;
    turn.append(who, body);
    els.transcript.append(turn);
    scroll(wasAtBottom);
    return body;
  }

  function showConversation() {
    els.login.classList.add("hidden");
    els.transcript.classList.remove("hidden");
    els.board.classList.add("hidden");
    els.system.classList.add("hidden");
    els.composer.classList.remove("hidden");
    if (voice.enabled) els.voiceBar.classList.remove("hidden");
    els.boardToggle.classList.remove("hidden");
    els.statusToggle.classList.remove("hidden");
    els.boardToggle.firstChild.textContent = "Scoreboard ";
    els.statusToggle.textContent = "System";
  }

  function showLogin(problem) {
    sessionStorage.removeItem(TOKEN_KEY);
    els.login.classList.remove("hidden");
    els.transcript.classList.add("hidden");
    els.board.classList.add("hidden");
    els.system.classList.add("hidden");
    els.composer.classList.add("hidden");
    els.voiceBar.classList.add("hidden");
    els.boardToggle.classList.add("hidden");
    els.statusToggle.classList.add("hidden");
    els.loginProblem.textContent = problem || "";
    setStatus("offline");
  }

  // The escalation levels of addendum 17 §10. Urgent is called out in the header
  // because the notification channels that section defers to a later spec do not
  // exist: an urgent item is seen when the Super User looks, so looking has to
  // show it.
  function renderCounts(counts) {
    if (!counts) return;
    const open = counts.urgent + counts.important + counts.informational;
    els.boardCount.textContent = open === 0 ? "" : counts.urgent > 0 ? `${open} · ${counts.urgent} urgent` : `${open}`;
    els.boardCount.className = "count" + (counts.urgent > 0 ? " urgent" : "");
  }

  function renderItem(item) {
    const card = document.createElement("article");
    card.className = "item " + item.importance + (item.status === "resolved" ? " resolved" : "");

    const meta = document.createElement("div");
    meta.className = "meta";
    const parts = [
      [`#${item.id}`, ""],
      [item.importance, "level " + item.importance],
      [item.blocking ? "blocking" : "non-blocking", ""],
      [item.status, ""],
    ];
    if (item.related_spec) parts.push([item.related_spec, ""]);
    if (item.related_component) parts.push([item.related_component, ""]);
    for (const [text, className] of parts) {
      const span = document.createElement("span");
      span.textContent = text;
      if (className) span.className = className;
      meta.append(span);
    }

    const question = document.createElement("p");
    question.className = "question";
    question.textContent = item.question;
    card.append(meta, question);

    for (const note of item.notes || []) {
      const line = document.createElement("p");
      line.className = "note";
      line.textContent = `${note.author}: ${note.note}`;
      card.append(line);
    }
    if (item.resolution) {
      const line = document.createElement("p");
      line.className = "resolution";
      line.textContent = "resolved: " + item.resolution;
      card.append(line);
    }

    // The listing leaves notes out on purpose - twenty items each carrying a
    // full discussion is not a list anybody reads - so an item's discussion is
    // fetched when it is opened. Without this the discussion would exist in the
    // database and nowhere a person could see it.
    if (item.notes === undefined) {
      card.addEventListener("click", async () => {
        if (card.dataset.expanded) return;
        card.dataset.expanded = "1";
        const token = sessionStorage.getItem(TOKEN_KEY);
        const response = await fetch(`/scoreboard/${item.id}`, {
          headers: { Authorization: "Bearer " + token },
        });
        if (!response.ok) return;
        const full = await response.json();
        const expanded = renderItem(full);
        if ((full.notes || []).length === 0 && !full.resolution) {
          const empty = document.createElement("p");
          empty.className = "discussion";
          empty.textContent = "no discussion yet";
          expanded.append(empty);
        }
        card.replaceWith(expanded);
      });
    }
    return card;
  }

  async function showBoard() {
    const token = sessionStorage.getItem(TOKEN_KEY);
    els.transcript.classList.add("hidden");
    els.composer.classList.add("hidden");
    els.board.classList.remove("hidden");
    els.boardToggle.firstChild.textContent = "Conversation ";
    els.board.replaceChildren();

    let body;
    try {
      const response = await fetch("/scoreboard", { headers: { Authorization: "Bearer " + token } });
      if (response.status === 401) return showLogin("Session expired. Sign in again.");
      body = await response.json();
    } catch (err) {
      const problem = document.createElement("p");
      problem.className = "empty";
      problem.textContent = "Could not reach the Gateway.";
      els.board.append(problem);
      return;
    }

    renderCounts(body.open_counts);
    if (body.items.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Nothing on the board.";
      els.board.append(empty);
      return;
    }
    for (const item of body.items) els.board.append(renderItem(item));
  }

  // The system view. Its most important state is the one where there is nothing to
  // show: addendum 16 §23 means an unreachable backend must read as a fact about
  // Jarvis, not as a fault in the Gateway - so it renders the reason plainly and
  // the rest of the page keeps working.
  async function showSystem() {
    const token = sessionStorage.getItem(TOKEN_KEY);
    els.transcript.classList.add("hidden");
    els.board.classList.add("hidden");
    els.composer.classList.add("hidden");
    els.system.classList.remove("hidden");
    els.statusToggle.textContent = "Conversation";
    els.system.replaceChildren();

    let body;
    try {
      const response = await fetch("/status", { headers: { Authorization: "Bearer " + token } });
      if (response.status === 401) return showLogin("Session expired. Sign in again.");
      body = await response.json();
    } catch (err) {
      body = { available: false, reason: "Could not reach the Gateway." };
    }

    if (!body.available) {
      const note = document.createElement("p");
      note.className = "unavailable";
      note.textContent = body.reason;
      els.system.append(note);
      return;
    }

    if (body.agents.length === 0) {
      const note = document.createElement("p");
      note.className = "unavailable";
      note.textContent = "The backend is running and no agents are registered.";
      els.system.append(note);
      return;
    }

    for (const agent of body.agents) {
      const row = document.createElement("div");
      const crashed = agent.process_state === "crashed";
      const dormant = agent.lifecycle_state === "dormant";
      row.className = "agent" + (crashed ? " crashed" : dormant ? " dormant" : "");

      const identity = document.createElement("span");
      identity.className = "identity";
      identity.textContent = agent.identity;
      row.append(identity);

      // Both axes, always, and never merged into one word - a dormant agent and
      // a crashed one both have no process, and only one of them is a fault.
      for (const [value, bad] of [
        [agent.lifecycle_state, false],
        [agent.process_state, crashed],
        [agent.heartbeat_age_seconds === null ? "no heartbeat" : `${agent.heartbeat_age_seconds}s ago`, false],
      ]) {
        const span = document.createElement("span");
        span.className = "axis" + (bad ? " bad" : "");
        span.textContent = value;
        row.append(span);
      }
      els.system.append(row);
    }
  }

  els.statusToggle.addEventListener("click", () => {
    if (els.system.classList.contains("hidden")) showSystem();
    else showConversation();
  });

  els.boardToggle.addEventListener("click", () => {
    if (els.board.classList.contains("hidden")) showBoard();
    else showConversation();
  });


  // ------------------------------------------------------------------ voice
  //
  // Addendum 16 §9: voice is a primary interface, not an optional enhancement -
  // natural speech, streaming, low latency, interruption, a visible transcript,
  // text when wanted, and switching between the two without losing context.
  //
  // Recognition and synthesis are the browser's own (Web Speech API). Three
  // reasons, and one cost that has to be stated rather than buried:
  //
  //   * No new dependency, no API key, no second bill, and no audio for this
  //     service to hold. A server-side speech provider would be more code and
  //     more secrets on the first day of a feature that §9 itself expects to be
  //     rebuilt once it has been used in anger.
  //   * It works in the phone browser addendum 16 §8 targets.
  //   * The transcript is what reaches the model either way, so moving to a
  //     server-side provider later changes this file and nothing else.
  //
  // THE COST: in Chrome, SpeechRecognition sends audio to Google's servers to be
  // transcribed; in Safari, to Apple's. That is a real disclosure for a project
  // whose point is controlling what leaves, and it is in the README rather than
  // left for somebody to discover. Speaking is local to the device.
  //
  // BARGE-IN IS BY TAP, NOT BY VOICE, deliberately. Recognition left running
  // while the phone speaker plays a reply transcribes the reply - the assistant
  // interrupts itself, forever. Open-mic interruption needs echo cancellation
  // against the synthesised audio, which is real work and is not built. So
  // listening pauses while speaking, and Stop - or the microphone button, or
  // sending text - cuts the reply off instantly and hands the turn back. The
  // user can always interrupt; the microphone cannot.
  const speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;

  const voice = {
    enabled: false,
    recognizer: null,
    speaking: false,
    supported: Boolean(speech && synth),
  };

  function setVoiceState(text, kind) {
    els.voiceState.textContent = text;
    els.voiceState.className = kind || "";
  }

  function startListening() {
    if (voice.speaking) return;
    // The indicator has to stop saying "speaking" the moment speech ends, even
    // when listening cannot resume - found in verification, where the label sat
    // on "speaking - tap Stop to interrupt" long after the reply had finished.
    // A status line that describes something the assistant is not doing is worse
    // than no status line, because it is believed.
    if (!voice.enabled || !voice.recognizer) {
      setVoiceState("voice is off - tap the microphone to start");
      return;
    }
    try {
      voice.recognizer.start();
      setVoiceState("listening...", "hearing");
    } catch (err) {
      // start() throws when it is already running, which is not a problem.
      setVoiceState("listening...", "hearing");
    }
  }

  function speak(text) {
    if (!voice.enabled || !(text || "").trim()) return;
    stopSpeaking();
    voice.speaking = true;
    try {
      voice.recognizer && voice.recognizer.stop();
    } catch (err) {}

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = utterance.onerror = () => {
      voice.speaking = false;
      startListening();
    };
    setVoiceState("speaking - tap Stop to interrupt", "speaking");
    synth.speak(utterance);
  }

  function stopSpeaking() {
    if (synth && (synth.speaking || synth.pending)) synth.cancel();
    voice.speaking = false;
  }

  function handleTranscript(text) {
    // The one place a heard sentence becomes a turn, so voice and typing share a
    // path: §9's "switching between voice and text without losing context" is
    // then true by construction rather than by effort.
    const said = (text || "").trim();
    if (!said) return;
    els.input.value = said;
    els.composer.requestSubmit();
  }

  function enableVoice() {
    if (!voice.supported) return;
    voice.enabled = true;
    els.mic.classList.add("on");
    els.voiceBar.classList.remove("hidden");

    voice.recognizer = new speech();
    voice.recognizer.lang = navigator.language || "en-US";
    voice.recognizer.interimResults = false;
    voice.recognizer.continuous = false;

    voice.recognizer.addEventListener("result", (event) => {
      const last = event.results[event.results.length - 1];
      if (last.isFinal) handleTranscript(last[0].transcript);
    });
    // Recognition ends after every utterance and after every silence. Restarting
    // is what makes it feel continuous; without this the microphone goes deaf
    // after one sentence and the user is left tapping it again.
    voice.recognizer.addEventListener("end", () => {
      if (voice.enabled && !voice.speaking) startListening();
    });
    voice.recognizer.addEventListener("error", (event) => {
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        disableVoice();
        addTurn("error", "Microphone permission was refused, so voice is off.");
      } else if (event.error !== "no-speech" && event.error !== "aborted") {
        setVoiceState("recognition error: " + event.error);
      }
    });

    startListening();
  }

  function disableVoice() {
    voice.enabled = false;
    stopSpeaking();
    try {
      voice.recognizer && voice.recognizer.abort();
    } catch (err) {}
    voice.recognizer = null;
    els.mic.classList.remove("on");
    els.voiceBar.classList.add("hidden");
  }

  els.mic.addEventListener("click", () => {
    if (!voice.supported) {
      addTurn(
        "error",
        "This browser has no Web Speech API, so voice is unavailable here. " +
          "Text still works; Chrome and Safari support voice."
      );
      return;
    }
    // Tapping the microphone while the assistant is talking is an interruption,
    // not a request to switch voice off.
    if (voice.enabled && voice.speaking) {
      stopSpeaking();
      startListening();
      return;
    }
    voice.enabled ? disableVoice() : enableVoice();
  });

  els.interrupt.addEventListener("click", () => {
    stopSpeaking();
    startListening();
  });

  if (!voice.supported) els.mic.classList.add("unsupported");

  // A seam for verification: the speech APIs cannot be driven from a test, so the
  // handlers they call are reachable directly. Not a second code path - these are
  // the same functions the events call.
  window.jarvisVoice = {
    state: voice,
    speak,
    stopSpeaking,
    handleTranscript,
    enable: enableVoice,
    disable: disableVoice,
  };

  function connect(token) {
    const scheme = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(`${scheme}//${location.host}/ws`);
    setStatus("connecting…");

    socket.addEventListener("open", () => {
      // The token goes in the first frame rather than the URL: a query string
      // lands in server logs, proxy logs and history. See gateway/main.py.
      socket.send(JSON.stringify({ type: "auth", token }));
    });

    socket.addEventListener("message", (event) => {
      const frame = JSON.parse(event.data);
      if (frame.type === "ready") {
        showConversation();
        setStatus("connected", "live");
        renderCounts(frame.open_counts);
        els.transcript.replaceChildren();
        for (const message of frame.messages) addTurn(message.role, message.text);
        els.main.scrollTop = els.main.scrollHeight;
      } else if (frame.type === "tool") {
        // The assistant just did something durable. Shown as it happens rather
        // than only in the reply, because a filed item is a change to the
        // project's record and should not arrive as a claim.
        setStatus(frame.ok ? frame.name.replace(/_/g, " ") : frame.name + " failed", frame.ok ? "live" : "error");
      } else if (frame.type === "delta") {
        const wasAtBottom = atBottom();
        if (!streaming) streaming = addTurn("assistant", "");
        streaming.textContent += frame.text;
        scroll(wasAtBottom);
      } else if (frame.type === "done") {
        // Spoken when the turn is complete rather than per delta: a synthesiser
        // fed fragments reads each as its own sentence, and the result is a
        // stutter that sounds like a fault.
        const spoken = streaming ? streaming.textContent : "";
        streaming = null;
        els.send.disabled = false;
        setStatus("connected", "live");
        renderCounts(frame.open_counts);
        if (!els.board.classList.contains("hidden")) showBoard();
        speak(spoken);
      } else if (frame.type === "error") {
        streaming = null;
        els.send.disabled = false;
        if (frame.error === "unauthorized") showLogin("Session expired. Sign in again.");
        else addTurn("error", frame.error);
      }
    });

    socket.addEventListener("close", (event) => {
      socket = null;
      streaming = null;
      els.send.disabled = false;
      if (event.code === 4401) showLogin("Session expired. Sign in again.");
      else setStatus("disconnected — reload to reconnect", "error");
    });

    socket.addEventListener("error", () => setStatus("connection error", "error"));
  }

  els.login.addEventListener("submit", async (event) => {
    event.preventDefault();
    els.loginProblem.textContent = "";
    let response;
    try {
      response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: els.username.value, password: els.password.value }),
      });
    } catch (err) {
      els.loginProblem.textContent = "Gateway unreachable.";
      return;
    }
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      els.loginProblem.textContent = body.detail || `Sign-in failed (${response.status}).`;
      return;
    }
    const { token } = await response.json();
    sessionStorage.setItem(TOKEN_KEY, token);
    els.password.value = "";
    connect(token);
  });

  els.composer.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = els.input.value.trim();
    if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
    // Sending anything interrupts a reply in progress - typing over the
    // assistant is as much an interruption as tapping Stop.
    stopSpeaking();
    addTurn("user", text);
    socket.send(JSON.stringify({ type: "message", text }));
    els.input.value = "";
    els.input.style.height = "auto";
    els.send.disabled = true;
  });

  // Enter sends, Shift+Enter breaks the line — but not on a touch keyboard,
  // where Enter is the only newline the user has.
  els.input.addEventListener("keydown", (event) => {
    const touch = window.matchMedia("(pointer: coarse)").matches;
    if (event.key === "Enter" && !event.shiftKey && !touch) {
      event.preventDefault();
      els.composer.requestSubmit();
    }
  });

  els.input.addEventListener("input", () => {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 128) + "px";
  });

  const existing = sessionStorage.getItem(TOKEN_KEY);
  if (existing) connect(existing); else showLogin();
})();
</script>
</body>
</html>
