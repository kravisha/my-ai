# Machine-readable Model Registry and Model Requirement Profiles, as IMPLEMENTED.
#
# Addendum 35 §3-§5 under addendum 30 §12's metadata-before-code doctrine
# (TASK_QUEUE TQ-16, SPEC_RECONCILIATION §64). This file describes the model
# reality that exists and runs - one configured engine behind one provider
# interface - not the multi-model target addendum 35 describes. Like
# docs/organization.yaml, it is an assertion, not a wish list:
# tests/test_model_registry.py checks every claim here against the code, and a
# model consumer added to the code without a profile here fails the suite
# until somebody declares it on purpose.
#
# What this file is NOT, since TQ-51 (§103): it is not the Model Performance
# Registry addendum 45 §8 describes. The split is by **writer**, not by subject.
# This file is hand-authored, committed, reviewed, and asserted against the code
# by tests. The performance registry is machine-written after every task, at a
# volume no committed file should carry - scores in git would dirty the working
# tree on every inference and make these assertions race a moving target.
#
# The one genuine overlap is `preferred_model` below. Addendum 45 §16 is explicit
# that an agent should NOT choose its own model - it classifies the task, and a
# common routing layer chooses. So `preferred_model` is precisely what addendum
# 45 supersedes. Until routing exists it stays, read at call time and honest
# about being a hand-authored guess; from TQ-60 it becomes the **seed** the
# leaderboard starts from (§12) and stops being read at call time. Recorded here
# so that transition is a planned handover rather than a field that quietly
# means two different things.
#
# Two disciplines this file lives under:
#
# - Addendum 35 §2: every mapping is a PROVISIONAL starting hypothesis. No
#   provider or model earns permanent status because it was the first default;
#   `provisional: true` is required on every model and every profile until a
#   benchmark says otherwise, and the test enforces it.
# - Empirical or absent (35 §3: "registry values should be empirical whenever
#   possible"): fields nobody has measured are listed under `unmeasured` with
#   no number at all, never filled from a vendor spec sheet - a spec-sheet
#   figure would be somebody else's claim wearing this file's authority. The
#   `observed` block carries only what this system has actually measured, each
#   entry naming where the measurement is recorded.
#
# `routing` is a pinned decision, not an omission: a routing engine with one
# route is machinery without a decision to make (§60 disposition 2). The test
# asserts what THIS rung of `routing_stages` requires - so registering a second
# model fails the suite until routing is revisited on purpose, which turns "we
# should think about routing someday" into a recorded decision with a tripwire.
#
# TQ-51 (SPEC_RECONCILIATION §103) turned that boolean pin into a ladder,
# because addendum 45 needs four to eight models and the tripwire fired on its
# first real step - exactly as §64 intended. **The tripwire was re-aimed, not
# removed.** A discipline deleted the first time it is inconvenient was never a
# discipline; each rung below carries its own, and advancing to a rung whose
# enforcement is not built yet fails loudly rather than passing silently.
#
# The value below is the rung this system is ON. Moving it is a deliberate act
# with a queue entry behind it, never a tidy-up.

version: 1
routing: seeded_leaderboard

# The ladder (addendum 45 §12, §13, §45 Phase C+F). Each rung names the queue
# entry that earns it and what its tripwire demands. `enforced: false` means the
# assertion is not built yet - the rung exists so the ladder is legible, and the
# test refuses to stand on it rather than pretending it holds.
routing_stages:
  - stage: none_single_model
    earned_by: TQ-16 (§64)
    enforced: true
    requires: >
      Exactly one configured model, and it is the one the code constructs.
      Profiles carry no fallbacks, because there is nowhere to fall back to.

  - stage: seeded_leaderboard
    earned_by: TQ-54
    enforced: true
    requires: >
      Every configured model has a seeded entry on every task-category
      leaderboard, and every seeded score is marked SEEDED/PROVISIONAL
      (addendum 45 §12). A configured model no routing decision can reach is
      the failure this rung exists to catch.

  - stage: competitive
    earned_by: TQ-63
    enforced: false
    requires: >
      Measured outcomes dominate the seed (addendum 45 §12), rankings move on
      evidence (§10), and a failure in one category does not demote a model
      globally (§11).

models:
  # WITHDRAWN FROM THE RUNTIME on 2026-09-16, on Krish's instruction from
  # abroad: the application must not call this vendor for normal model work, and
  # no request may fall back to it. `app/model_routing.assert_no_anthropic`
  # refuses to build a router containing it, so this row describes a model the
  # runtime cannot reach - which is why its status is not `configured`.
  #
  # The row STAYS, and deliberately. It is where the measured facts about this
  # deployment's first year of model behaviour live, and `status: retired` is a
  # statement somebody can check against the code; deleting the row would make
  # the same claim unverifiable. The Claude development sessions that build this
  # system still use that vendor, and that is a different thing from the
  # application runtime - see `app/model_routing.anthropic_key_consumers`.
  - id: claude-sonnet-5
    provider: anthropic
    status: retired
    retired_on: 2026-09-16
    retired_because: >
      Krish's routing instruction of 2026-09-16 - local first, Kimi remote
      second, explicit failure third, and never this vendor as a fallback.
      Enforced at construction in app/model_routing.py rather than by a switch,
      because a switch that can be turned on can be turned on by accident.
    provisional: true
    # The class remains in app/model_provider.py so this row is verifiable, and
    # nothing in the runtime constructs it.
    interface: app/model_provider.py::AnthropicProvider
    deployment: cloud
    tool_support: true
    streaming: true
    # The budget the breaker enforces per UTC day (app/model_budget.py) -
    # the only cost facts this deployment has, since spend is metered in
    # tokens and calls, not currency (§52's recorded deferral).
    budget:
      daily_tokens: 500000
      daily_calls: 2000
    observed:
      - fact: idle organization burned ~500k tokens/hour before the origination cooldown
        recorded_in: SPEC_RECONCILIATION.md §57 (measured 2026-08-25)
      - fact: zero steady-state idle spend after the cooldown; ceiling one paid chain per security per hour
        recorded_in: SPEC_RECONCILIATION.md §58
      - fact: Analysis deep-reasoning pass takes ~2 minutes per call under the 3-pass budget
        recorded_in: SPEC_RECONCILIATION.md §42
      - fact: UQI answer latency through this model, analysis role, 5.8/19.4/24.0s over three samples
        recorded_in: docs/TIMING_CONSTANTS.md
    unmeasured:
      - context_window
      - coding_score
      - reasoning_score
      - language_score
      - structured_output_reliability
      - hallucination_rate
      - rate_limits
      - availability_history
    benchmark_date: null

  # THE REMOTE TIER as of 2026-09-16. Krish's instruction named "Kimi K2" for
  # the local half and "Kimi K3" for the key; neither is an API model id, and he
  # warned in the same message not to assume the marketing name and the id are
  # the same. He was right to. Everything on this row below `status` was
  # MEASURED by Deployments/probe-kimi-api.ps1 at 2026-09-16T22:40 local, whose
  # trace is _probe-kimi.log, because a session on that machine cannot make an
  # outbound call and a router written against a guessed id is the failure he
  # asked to be prevented.
  #
  # What the probe had to discover, and why the base url looks unusual: this
  # credential was refused 401 by both Moonshot developer bases and 404 by
  # api.kimi.com/v1. It authenticates against api.kimi.com/coding/v1. So it is a
  # Kimi subscription key rather than a Moonshot platform key, and the working
  # address is not the one any documentation search produces.
  - id: k3-256k
    provider: kimi
    status: configured
    provisional: true
    # The one place this vendor is constructed. The dialect is OpenAI-shaped
    # rather than Anthropic-shaped, which is the whole substance of that module:
    # callers walk plain dictionaries, so AGENT != MODEL survives a second
    # vendor (addendum 16 §24) - and this row is the evidence it does.
    interface: app/kimi_provider.py::KimiProvider
    deployment: cloud
    base_url: https://api.kimi.com/coding/v1
    dialect: openai
    tool_support: true
    streaming: true
    # The breaker in app/model_budget.py is per-deployment rather than
    # per-model, so the ceiling on the retired row above governs every call this
    # system makes, including these. Not repeated here: two budget blocks would
    # read as two budgets.
    observed:
      - fact: >
          the credential authenticates against https://api.kimi.com/coding/v1
          and is refused 401 by api.moonshot.ai and api.moonshot.cn
        recorded_in: Deployments/_probe-kimi.log (measured 2026-09-16 22:40)
      - fact: >
          the provider's own catalogue at that base returns four ids -
          kimi-for-coding, kimi-for-coding-highspeed, k3-256k, k3
        recorded_in: Deployments/_probe-kimi.log (measured 2026-09-16 22:40)
      - fact: >
          k3-256k answered a real completion, 1741 ms for an 8-token reply,
          cold, usage reported as prompt=93 completion=8
        recorded_in: Deployments/_probe-kimi.log (measured 2026-09-16 22:40)
    unmeasured:
      - context_window
      - coding_score
      - reasoning_score
      - language_score
      - structured_output_reliability
      - hallucination_rate
      - rate_limits
      - availability_history
      # The one that matters most and is hardest to get: whether its tool calls
      # are well-formed under this system's real tool definitions. The unit
      # translation is tested (tests/test_kimi_provider.py); the model's own
      # behaviour with thirty tools in front of it is not, and cannot be until
      # it has served real turns.
      - tool_call_fidelity
    benchmark_date: null

# The hand-authored provisional ordering each task leaderboard starts from
# (addendum 45 §12, TQ-54, SPEC_RECONCILIATION §105).
#
# It lives here, in the committed file, for the reason §103 gave for splitting
# the two registries by **writer**: an initial ordering is a human decision, and
# the measurements that supersede it are machine-written. Putting the ordering in
# the runtime database would also make the `seeded_leaderboard` rung uncheckable -
# CI has no database, so a tripwire that read one would assert nothing.
#
# `app/model_performance.seed_from_registry()` reads this; the scores it derives
# and everything measured afterwards live in model_performance.db, never here.
#
# Every entry is PROVISIONAL by construction (§12): the seed is worth
# SEED_PRIOR_SAMPLES observations and decays automatically as real outcomes
# arrive. Nobody decides when evidence takes over - arithmetic does.
#
# One model appears today because one model is configured. That is not a claim
# that it is good at these eight things; a single-model ordering carries no
# information and is scored at exact neutral to say so. When TQ-57 and TQ-58 add
# local candidates, they enter here as an ordering somebody chose and defended.
#
# CHANGED 2026-09-16: the single entry is now k3-256k rather than claude-sonnet-5,
# because the configured model changed. The retired row is deliberately NOT left
# in these orderings - a leaderboard that ranked a model no routing decision can
# reach would be the exact failure the `seeded_leaderboard` rung exists to catch,
# pointing the other way. And it is still a single-model ordering, so it still
# carries no information about whether this model is good at these eight things.
# The day that becomes a real ranking is the day it has served real turns.
seed_ordering:
  GENERAL_REASONING_AND_PLANNING: [k3-256k]
  CODING_AND_DEBUGGING: [k3-256k]
  LONG_CONTEXT_AND_MEMORY: [k3-256k]
  CLASSIFICATION_AND_ROUTING: [k3-256k]
  FINANCIAL_AND_ANALYTICAL_REASONING: [k3-256k]
  SUMMARIZATION_AND_KNOWLEDGE_EXTRACTION: [k3-256k]
  CREATIVE_GENERATION: [k3-256k]
  CAPABILITY_AND_ESCALATION_DECISION: [k3-256k]

# One profile per code location that reaches the model. `code_ref` is the
# consuming module (the test scans for undeclared consumers); `role` is the
# fi_db.ROLE_CHARTERS identity where the consumer is an organizational agent,
# null where it is a surface or a shared capability. `call_shape` binds each
# declared call to the constant in the code that sizes it, so a resized call
# fails here until the profile is updated - the same drift guard
# TIMING_CONSTANTS.md applies to rates.
profiles:
  - agent_class: analysis
    role: analysis
    code_ref: agents/analysis.py
    task_type: deep multi-source reasoning, thesis challenge, report grading
    criticality: high
    latency_tolerance: minutes (measured ~2min/call, §42)
    preferred_model: k3-256k
    fallback_models: []
    provisional: true
    call_shape:
      - purpose: deep analysis pass
        max_tokens: 4096
        source: ANALYSIS_MAX_TOKENS
      - purpose: challenge pass
        max_tokens: 1024
        source: CHALLENGE_MAX_TOKENS

  - agent_class: explorer
    role: explorer
    code_ref: agents/explorer.py
    task_type: lightweight coherence gate over a deterministic detector's candidate
    criticality: low
    latency_tolerance: seconds
    preferred_model: k3-256k
    fallback_models: []
    provisional: true
    call_shape:
      - purpose: judgment gate
        max_tokens: 300
        source: JUDGMENT_MAX_TOKENS

  - agent_class: speculator
    role: speculator
    code_ref: agents/speculator.py
    task_type: stance reading over social chatter
    criticality: low
    latency_tolerance: seconds
    preferred_model: k3-256k
    fallback_models: []
    provisional: true
    call_shape:
      - purpose: stance read
        max_tokens: 300
        source: STANCE_MAX_TOKENS

  - agent_class: introspection
    role: null   # a capability every agent process carries (UQI answers), not a role of its own
    code_ref: agents/introspection.py
    task_type: agent self-awareness answers to Universal Query Interface questions
    criticality: medium
    latency_tolerance: seconds (UQI_TIMEOUT_SECONDS is 60s; worst observed 24s)
    preferred_model: k3-256k
    fallback_models: []
    provisional: true
    call_shape:
      - purpose: UQI answer
        max_tokens: 500
        source: UQI_MAX_TOKENS

  - agent_class: coo_chat
    role: coo   # the operator is talking to the COO, whose charter this answers under
    code_ref: backend/coo_chat.py
    task_type: answering operator questions from a bounded snapshot of real system state
    criticality: medium
    latency_tolerance: interactive
    preferred_model: k3-256k
    fallback_models: []
    provisional: true
    call_shape:
      - purpose: grounded answer to one operator question
        max_tokens: 900
        source: MAX_TOKENS

  - agent_class: backend_chat
    role: null   # the /chat surface, not an agent
    code_ref: backend/main.py
    task_type: operator conversation with tool dispatch and consent pauses
    criticality: high
    latency_tolerance: interactive
    preferred_model: k3-256k
    fallback_models: []
    provisional: true
    call_shape: []   # sized per call at the surface, no module constant to bind

  - agent_class: gateway_chat
    role: null   # the Gateway's streaming Jarvis surface, not an agent
    code_ref: gateway/main.py
    task_type: streaming super-user conversation
    criticality: high
    latency_tolerance: interactive (streaming; addendum 16 §9)
    preferred_model: k3-256k
    fallback_models: []
    provisional: true
    call_shape: []   # sized per call at the surface, no module constant to bind
