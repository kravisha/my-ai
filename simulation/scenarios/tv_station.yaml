id: tv_station
version: 1
lifecycle: active
description: >
  The television station, end to end, with a dedicated Anchor.

  Stage 2's question is the only one this scenario asks: *did every expected kind
  of action happen?* Not in the right order, not with good wording, not with the
  ideal agent - the Development Philosophy is explicit that those are Stage 3
  problems and that requiring them here would stop a complete system from ever
  being demonstrated.

  So the properties below are a completeness checklist drawn from the
  specification's own list: an event is detected, agents work, their findings
  reach the newsroom, a script is prepared, the Anchor receives and presents it,
  another agent appears, the Anchor can ask for more, a fallback fires, and the
  executive keeps running the organization throughout.

  A fallback firing is a pass, not a failure (philosophy §11). A dropped segment
  and a substituted guest are counted as evidence that the recovery paths exist.

# 240s rather than 180s, and measured rather than chosen. Judgment latency in
# this organization runs to a p50 of ~143s, so an analysis reaches the desk late
# in a three-minute run - the position opens and the run ends before it can close
# and be judged. The full flow the specification asks for is Explorer through to
# attribution, and it needs longer than one leg of it.
duration_seconds: 240

config:
  FI_MARKET_PROVIDER_SEED: 42
  FI_SOCIAL_PROVIDER_SEED: 7
  FI_FORCE_ANOMALY_SECURITIES: ""
  FI_BROADCAST_ENABLED: "1"
  # One broadcast day, played at the pace its rundown declares.
  #
  # The day is 695 planned seconds. At scale 5 that is ~139s of wall clock, which
  # fits inside this run with room for the fault at 45s to land mid-programme.
  # The rundown still declares real durations; only the clock reading them moves,
  # which is the separation of real from simulated time rather than a fudge.
  FI_BROADCAST_TIME_SCALE: "5"
  # Long enough that the station cannot come back on air inside this run. Before
  # this the executive reopened the moment sign-off landed and one run produced
  # fourteen days.
  FI_BROADCAST_DAY_GAP_SECONDS: "3600"

requires_model: true

# An agent is killed so breaking news has something to break about.
#
# Waiting for an incident to happen by itself is how a completeness test reports
# a green run over a condition that never occurred (§93). The station's
# interruption path is expected behaviour, so the condition is produced rather
# than hoped for - the same reason `slow_agent` stalls a model call on purpose.
#
# analysis-1 rather than the COO: the executive schedules the broadcast day, and
# killing it would test the Controller's recovery instead of the newsroom's.
faults:
  - at_seconds: 45
    action: kill
    target: analysis-1

expected_properties:
  # -- the station exists and ran --------------------------------------------
  - name: the station ran exactly one broadcast day
    metric: broadcast.days_opened
    assert: equals
    value: 1
    # `equals`, not `at_least`. Before the rundown had a clock, every segment
    # aired on the anchor's next work cycle and a 695-second day was over in
    # thirteen - so one run churned fourteen bulletins. A lower bound would have
    # passed throughout and said nothing about it.

  - name: the day reached sign-off rather than being cut short
    metric: broadcast.days_closed
    assert: equals
    value: 1

  - name: a dedicated anchor presented, not an executive
    metric: broadcast.presented_by_anchor
    assert: is_not_empty
    # The whole point of the Dedicated Anchor change. The COO may present as a
    # documented fallback, so this asserts an anchor did - not that nobody else
    # could have.

  # -- information reached the newsroom and became a script ------------------
  - name: the newsroom drew stories from the organization's own record
    metric: broadcast.stories_filed
    assert: at_least
    value: 1

  - name: more than one kind of event was reported
    metric: broadcast.story_kinds
    assert: is_not_empty

  - name: a script was prepared for the anchor
    metric: broadcast.scripts_prepared
    assert: at_least
    value: 1

  # -- it was presented -------------------------------------------------------
  - name: a programme aired
    metric: broadcast.programmes_aired
    assert: at_least
    value: 1

  - name: an advertisement break aired
    metric: broadcast.ad_breaks_aired
    assert: at_least
    value: 1

  - name: commercial inventory exists and is honestly reported unsold
    metric: broadcast.ad_slots_unsold
    assert: at_least
    value: 1

  - name: the station signed off
    metric: broadcast.signed_off
    assert: at_least
    value: 1

  # -- breaking news, and the return to schedule -----------------------------
  - name: an agent failure became breaking news
    metric: broadcast.breaking_stories
    assert: at_least
    value: 1

  - name: a news flash interrupted the schedule
    metric: broadcast.news_flashes_aired
    assert: at_least
    value: 1

  - name: the schedule resumed after the interruption
    metric: broadcast.segments_resumed
    assert: at_least
    value: 1
    # The interruption is only half the workflow. A station that cut away and
    # never came back would have broken rather than covered the story.

  # -- fallbacks are completeness, not failure (philosophy §11) ---------------
  - name: a fallback path was exercised
    metric: broadcast.segments_dropped
    assert: at_least
    value: 1
    # A programme reaching air with no story is dropped and the schedule
    # continues. Counted as evidence the recovery path exists, not as a defect.

  - name: the anchor asked an agent for more when the brief was short
    metric: broadcast.anchor_enquiries
    assert: at_least
    value: 1
    # Specification §6 and §10.8: the Anchor must not invent another agent's
    # experience when that agent could supply it, so a stand-in prompts a question.

  # -- the desk, and the show about it ---------------------------------------
  - name: the desk acted on the analysis
    metric: trading.orders
    assert: at_least
    value: 1
    # The flow the specification's headline demo asks for, reaching the step it
    # used to stop at: Explorer, Speculator, Analyst, Trader.

  - name: a trade was closed and judged by somebody other than the trader
    metric: trading.attributed
    assert: at_least
    value: 1

  - name: nothing on the desk claims to be priced
    metric: trading.is_priced
    assert: is_false
    # Every level comes from a generated surface. A P&L labelled as money would
    # be the first real lie this system told.

  # -- the executive kept running the organization ---------------------------
  - name: no directive failed while the station was on air
    metric: population.failed_directives
    assert: equals
    value: 0
    # Specification section 10.10: executive agents continue operating while the
    # Anchor presents. The COO schedules the day and then has nothing to do with
    # it - if presenting were still coupled to the executive, its ordinary work
    # would show damage here.

  - name: nothing was left running at the end
    metric: population.running_at_end
    assert: is_empty
