id: baseline_steady_state
version: 1
lifecycle: active
description: >
  The organization under ordinary conditions: a stable market with no forced
  dislocations, the default peer groups, and pinned provider seeds. Nothing here
  is meant to be difficult. It is the control run - the one that establishes what
  normal looks like, so that a later scenario's numbers mean something.

  It is also the run that catches the defect class this project has suffered most
  quietly: a duplicate agent process, an orphaned agent, or a queue that never
  drains all show up here without any adversarial condition at all. The first
  execution of this scenario found the third of those.

# Measured on the first run of this scenario, and stated here so nobody mistakes
# it for an oversight: with seed 42 and no forced dislocation, Explorer records
# ZERO detector events across the full 90 seconds. Every report in this run comes
# from Speculator.
#
# So this scenario does not exercise the Explorer -> Analysis path at all, and
# must not be read as covering it. That path needs a dislocation the market
# actually contains, which is what anomaly_burst is for. Asserting Explorer
# properties here would be asserting them against a fixture incapable of
# producing the phenomenon - the single most repeated mistake in this project's
# history.
#
# Explorer is not idle: it observes ~91 surface samples per security and drives
# the regime EWMA throughout. It simply never crosses the detection threshold.
duration_seconds: 90

# Pinned so the stimulus is identical between runs. The outcomes downstream of
# Analysis are not identical, because a language model sits in that path; see
# simulation/scenario.py on properties rather than transcripts.
config:
  FI_MARKET_PROVIDER_SEED: 42
  FI_SOCIAL_PROVIDER_SEED: 7
  FI_FORCE_ANOMALY_SECURITIES: ""

# Also measured and stated so it is not read as a defect: NO lens binds a regime
# baseline in this run. Binding requires min_graded_reports = 10 and the run
# produces four, because the queue does not drain (see the pressure ratio
# property below). The regime half of intelligence expiry is built and verified,
# and simply cannot engage inside 90 seconds at the observed drain rate.
requires_model: false

expected_properties:
  # --- the organization stayed intact ---------------------------------------
  - name: no agent was respawned
    metric: population.respawns
    assert: equals
    value: 0
    # The direct detector for the defect that once produced three concurrent
    # analysis-1 processes under one identity: a health threshold below real
    # model latency made COO conclude a busy agent had crashed.

  - name: no agent survived the run
    metric: population.running_at_end
    assert: is_empty
    # Twelve orphaned agent processes accumulated during earlier development,
    # found only by chasing a result one of them was still producing.

  - name: no directive failed
    metric: population.failed_directives
    assert: equals
    value: 0

  # --- work was actually done ----------------------------------------------
  # Without these a run in which nothing happened would pass everything else,
  # which is how a suite comes to assert that the system is fine because it is
  # idle.
  - name: reports were filed
    metric: pipeline.reports_filed
    assert: at_least
    value: 8

  - name: explorer observed the market throughout
    metric: intelligence.regime_observations
    assert: at_least
    value: 400

  - name: cross-checks were exchanged
    metric: cross_check.total
    assert: at_least
    value: 5

  # --- the pipeline actually moved ------------------------------------------
  - name: reports were retired
    metric: pipeline.reports_completed
    assert: at_least
    value: 1
    # Added after a survey run passed 10/11 while the two properties below were
    # vacuous: with zero completions, `unanalysed_completed_reports == 0` and
    # `ungraded_analyses == 0` are both trivially true. A run in which Analysis
    # never started would have satisfied every assertion about judgment.
    #
    # One, not more. What the queue can retire in ninety seconds is a measured
    # property of the drain rate (260-400s for a full queue, TIMING_CONSTANTS),
    # and a higher bar here would be asserting a throughput nobody has changed.

  # --- Parliament had a voice -----------------------------------------------
  - name: the Speaker kept watching
    metric: governance.speaker_observations
    assert: at_least
    value: 3
    # RE-AIMED before it was ever green (§128). It first read
    # `governance.speaker_reports at_least 3` — three rows — and the fix to the
    # Speaker's unbounded growth made rows count *changes* rather than looks. A
    # stable Parliament now produces exactly one row however long anybody
    # watches it, so the old property measured the wrong thing the moment
    # repeats stopped being rows.
    #
    # `speaker_observations` counts looking, which is what "the Speaker is doing
    # its job" was always meant to mean: a Speaker that registered and never
    # spoke would satisfy every population property while leaving the
    # organization's governance unreported, which is the failure §124 built it
    # to prevent.

  # --- nothing was consumed without being judged ----------------------------
  - name: every completed report was analysed
    metric: pipeline.unanalysed_completed_reports
    assert: equals
    value: 0

  - name: every analysis was graded
    metric: pipeline.ungraded_analyses
    assert: equals
    value: 0

  # --- timing constants still match the system they govern ------------------
  - name: no cross-check went unanswered
    metric: cross_check.unanswered_rate
    assert: at_most
    value: 0.0
    # This number is how a timeout set below real answer latency announces
    # itself. It read 0.67 when UQI's timeout was 15s against answers taking up
    # to 24s.

  - name: no cross-check was left open
    metric: cross_check.open_at_end
    assert: equals
    value: 0

  # --- the known bottleneck, held rather than endorsed -----------------------
  - name: the queue was not abandoned
    metric: queue.retirement_ratio
    assert: at_least
    value: 0.1
    # RE-AIMED, not deleted (§105, §110, §116, §128). This property asserted
    # `queue.pressure_ratio at_most 5.0`, measured at 1.89 and 3.15 on early
    # runs, and read 22.01 on a survey run in which nothing had regressed.
    #
    # The ratio is drain_interval / arrival_interval, and both halves move for
    # reasons unrelated to capacity. `has_pending_report` caps the backlog at one
    # report per producer per security, so arrivals come as an eleven-second
    # burst and then stop; a longer run lets completions spread out and raises
    # the drain interval. The survey showed it anti-correlated with health:
    #
    #     this scenario     90s   8 of 10 left pending   pressure 22.01
    #     developing_story 300s   2 of 10 left pending   pressure 34.08
    #
    # The healthier run reads worse. `saturation.yaml` had already named the
    # distinction the ratio cannot make - a queue that grows without bound and
    # one that saturates at a fixed depth need completely different fixes.
    #
    # The CONCERN is unchanged: does the organization retire what it files. The
    # floor is deliberately loose here and not elsewhere: with ten arrivals the
    # measure moves 0.1 per completion, and 0.2 was measured, so a tight bar on
    # this sample would flake. The real assertion lives in developing_story,
    # where three hundred seconds make the sample worth something.
